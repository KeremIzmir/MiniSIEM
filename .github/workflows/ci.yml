name: CI

# push yalnizca main icin: acik PR'i olan bir branch'e push hem 'push' hem
# 'pull_request' tetikleyip ayni degisikligi iki kez test ediyordu. PR'lar
# pull_request ile, main'e merge'ler push ile dogrulanir.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# GITHUB_TOKEN yalnizca okuma yetkisiyle calisir: is akisi sadece checkout, kurulum
# ve test yapar; depoya yazmasi gerekmez. En az yetki ilkesi.
permissions:
  contents: read

jobs:
  test:
    # Acik major OS etiketi: ubuntu-latest 2026-10/11'de 24.04 -> 26.04
    # gecisi yapacak. CI ortami bilincli olarak ubuntu-26.04 kullanir.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # pyproject "requires-python >=3.11" diyor; desteklenen tum kararli minor
        # surumler (3.11-3.14) gercekten dogrulanir. Onsurumler bu matrise girmez.
        # Gelistirme Windows'ta yapiliyor — Linux CI ayrica yol ayraci ve
        # buyuk/kucuk harf duyarliligi varsayimlarini yakalar.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      # Aksiyonlar degistirilemez tam commit SHA'sina sabitlenir (tag'ler tasinabilir);
      # yorumdaki surum okunabilirlik icindir.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bagimliliklari kur
        run: pip install -r requirements-dev.txt

      - name: Testler
        run: python -m pytest

      - name: Uctan uca duman testi
        # Ornek logta alarm VAR -> cikis kodu TAM OLARAK 1 beklenir.
        # 0 = kurallar sessizce sustu, 2 = ayar hatasi. Ancak yakalanmamis bir
        # istisna da Python'da 1 doner; bu yuzden cikis kodu tek basina yetmez:
        # alarm basliginin basildigini ve traceback olmadigini da dogrulariz.
        run: |
          set +e
          out=$(python cli.py sample_auth.log 2>&1)
          status=$?
          set -e
          echo "$out"
          echo "cikis kodu: $status (beklenen: 1)"
          test "$status" -eq 1
          if grep -q "Traceback" <<< "$out"; then
            echo "HATA: CLI cokmus (traceback)"; exit 1
          fi
          grep -q "=== ALARMLAR" <<< "$out"

      - name: Paket kurulabilir mi (metadata + sablon dahil)
        run: |
          pip install .
          # Repo DISINA gec: repo kokunde 'import dashboard' kurulu paketi degil
          # kaynak agaci bulur ve sablon kontrolu hicbir seyi dogrulamaz.
          cd "$RUNNER_TEMP"
          mini-siem --version
          mini-siem-dashboard --version
          python - <<'EOF'
          import os
          import pathlib
          import dashboard.app

          mod = pathlib.Path(dashboard.app.__file__).resolve()
          print("dashboard.app yuklendi:", mod)
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert workspace not in mod.parents, f"kurulu paket degil, kaynak agac import edildi: {mod}"
          template = mod.parent / "templates" / "index.html"
          assert template.is_file(), f"index.html kurulu pakete girmemis: {template}"
          print("sablon paketlendi:", template)
          EOF
